[package]
name = "codex-marketplace-schema"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"

[build-dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
serde_json = "1"
