name: Latest Codex compatibility

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-latest:
    name: Check latest stable Codex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install latest stable CLI without changing the lock file
        run: npm install --no-save --package-lock=false @openai/codex@latest
      - run: npm run test:codex
        env:
          CODEX_CANARY: '1'
