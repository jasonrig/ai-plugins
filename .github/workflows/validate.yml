name: Validate marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Schema, inventory, and code checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  schema-source:
    name: Regenerate schemas from pinned Codex source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CODEX_SCHEMA_SOURCE_DIR: ${{ github.workspace }}/.cache/codex/092d3acd6bec3e3a14bdc7e7a2810ab628ab759d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: npm run schema:check
      - run: cargo fmt --check --manifest-path tools/codex-schema/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path tools/codex-schema/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path tools/codex-schema/Cargo.toml

  codex:
    name: Codex CLI integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:codex
